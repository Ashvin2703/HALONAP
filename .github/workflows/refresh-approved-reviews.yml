name: Refresh approved review schema (preview only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-approved-review-schema-20261025
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh approved ratings and reviews
        run: python scripts/update_product_schema.py
      - name: Commit preview-only schema changes
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh approved product review schema snapshot"
            git push origin HEAD:seo-approved-review-schema-20261025
          fi
