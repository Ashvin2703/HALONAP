<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HALONAP | Admin Studio</title><style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2743;background:#f5f7fb;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dfb755;outline-offset:3px}
.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(175deg,#111b3b 0%,#0b1530 72%,#17254a 100%);border-right:1px solid #273452;padding:32px 16px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}
.brand{font-family:Georgia,serif;font-size:31px;font-weight:700;letter-spacing:2px;margin:0 14px 7px;color:#e9b947}.sub{font-size:10px;font-weight:700;letter-spacing:3.2px;color:#a7b5d0;margin:0 14px 36px}
.navwrap{display:grid;gap:4px}.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:13px 15px;border-radius:11px;color:#c5cde0;font-size:13px;font-weight:550;transition:background .16s,border-color .16s,color .16s}
.nav.active{background:#263758;border-color:#425476;color:#f4c763;font-weight:750;box-shadow:inset 3px 0 #e5b849}.nav:hover{background:#223252;color:#fff}.nav-icon{font-size:17px;width:23px;text-align:center;opacity:.95}
.sidefooter{margin-top:auto;padding:20px 14px 4px;color:#a4b3ce;font-size:12px;line-height:2}.sidefooter a{color:#f0c96b;text-decoration:none}
.main{padding:34px clamp(20px,3.5vw,56px) 64px;min-width:0;max-width:1600px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #e5e9f1;padding-bottom:19px;margin-bottom:23px}
.eyebrow{color:#99711f;font-size:10px;letter-spacing:2.1px;text-transform:uppercase;font-weight:800}
h1{font-family:Georgia,serif;font-weight:500;font-size:37px;letter-spacing:-.8px;margin:9px 0 0}h2{font-size:19px;font-weight:750;letter-spacing:-.3px;margin:0 0 16px}
.pill,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #d8deea;background:#fff;border-radius:10px;padding:10px 14px;color:#233657;font-size:12px;font-weight:700;text-decoration:none;min-height:39px}
.pill{background:#f0f3f9;color:#455473;border-radius:999px}.btn:hover{background:#f7f9fd;border-color:#adbacf}.btn.primary{background:#dba936;color:#111b34;border-color:#dba936;font-weight:800}.btn.primary:hover{background:#efc25d}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.panel{background:#fff;border:1px solid #e6eaf1;border-radius:16px;padding:23px;box-shadow:0 5px 22px rgba(21,35,64,.035)}
.card{min-height:142px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#d8a334,#f6d987)}
.metric{font-size:30px;letter-spacing:-1px;font-weight:750;margin:18px 0 5px;color:#152545;font-variant-numeric:tabular-nums}.muted{color:#738099;font-size:12px;line-height:1.55}.panel{margin-top:19px;overflow:auto}.panel .panel{box-shadow:none;background:#fcfdff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,select{border:1px solid #dce2ec;background:#fff;color:#182849;border-radius:9px;padding:11px 12px;max-width:100%;min-height:40px}input::placeholder{color:#8995a9}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:590px}td,th{padding:15px 13px;text-align:left;border-bottom:1px solid #edf0f5;vertical-align:middle}th{background:#f7f9fc;color:#667590;font-size:10px;letter-spacing:.7px;text-transform:uppercase;font-weight:800}tbody tr:hover{background:#fbfcff}td small{display:block;color:#7c899e;margin-top:5px}
.tag{border-radius:99px;background:#f4ead2;color:#82601b;padding:5px 10px;white-space:nowrap}.hide{display:none!important}.notice{padding:15px 18px;border:1px solid #f1e3b8;border-radius:11px;background:#fffbef;color:#82601d;margin-top:20px;font-size:13px;line-height:1.6}
.login{max-width:440px;margin:10vh auto;padding:38px;background:#fff!important;color:#1b2743}.login .brand{margin:0 0 16px}.login h2{font-family:Georgia,serif;font-size:27px}.login input{width:100%;margin:7px 0 15px}.login button{width:100%;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tiny{font-size:12px}a{color:#946c1b}
.welcome{background:linear-gradient(115deg,#111c3d,#20365d);border-radius:17px;color:#fff;padding:27px 31px;margin-bottom:21px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 10px 25px #16294c16}.welcome h2{font-family:Georgia,serif;font-weight:500;font-size:26px;margin:8px 0}.welcome p{margin:0;color:#cad4e8;font-size:13px}.welcome .eyebrow{color:#f3ca6d}.welcome-mark{color:#efc663;font-family:Georgia,serif;font-size:43px;opacity:.9}
@media(max-width:1080px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;min-height:0;position:relative;padding:17px 14px 12px;border-right:0;border-bottom:1px solid #26324e}.brand{font-size:24px}.sub{margin:0 14px 13px}.navwrap{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}.nav{width:auto;white-space:nowrap;padding:11px 13px;flex-shrink:0}.sidefooter{display:none}.main{padding:23px 16px 40px}.top{align-items:flex-start}h1{font-size:31px}}
@media(max-width:500px){.cards{gap:10px}.card{padding:15px;min-height:125px}.metric{font-size:25px}.top .pill{display:none}.welcome{padding:20px}.welcome h2{font-size:22px}.welcome-mark{display:none}.panel{padding:16px}}

.brand-logo{background:#fff;border-radius:12px;padding:10px 12px;margin:0 10px 12px;display:flex;align-items:center;justify-content:center;min-height:69px}.brand-logo img{display:block;width:100%;height:auto;max-height:57px;object-fit:contain}.login .brand-logo{margin:0 0 22px;max-width:250px;border:1px solid #edf0f5;background:#fff}.side .brand-logo{box-shadow:0 5px 15px #0000001a}@media(max-width:900px){.side .brand-logo{max-width:200px;min-height:55px;padding:7px 10px;margin-bottom:8px}}

.brand-wordmark{display:block;background:transparent;border:0;box-shadow:none;color:#f5f7ff;font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",Arial,sans-serif;font-size:34px;font-weight:750;letter-spacing:-1.8px;line-height:1.2;text-transform:none;padding:0;margin:0 14px 8px}.brand-wordmark .gold-o{color:#e3a72d}.login .brand-wordmark{color:#101b4b;margin:0 0 20px;font-size:42px}.side .brand-wordmark{color:#f3f5ff}@media(max-width:900px){.side .brand-wordmark{font-size:29px;margin-bottom:8px}}
</style></head><body>
<div id="login" class="panel login"><div class="brand brand-wordmark" aria-label="Halonap">Hal<span class="gold-o">o</span>nap</div><p class="eyebrow">Private Management Studio</p><h2>Admin sign in</h2><p class="muted">Only authorised HALONAP administrators can access customer orders.</p><form id="loginForm"><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required></label><button class="btn primary">Sign in securely</button></form><p id="loginMsg" class="muted" role="status"></p><a class="tiny" href="/">← Back to HALONAP</a></div>
<div id="app" class="shell hide"><aside class="side"><div class="brand brand-wordmark" aria-label="Halonap">Hal<span class="gold-o">o</span>nap</div><div class="sub">ADMIN STUDIO</div><div class="navwrap" id="nav"></div><div class="sidefooter">Private · HALONAP UK<br><a href="/">View storefront ↗</a></div></aside><main class="main"><div class="top"><div><div class="eyebrow">HALONAP · MANAGEMENT</div><h1 id="pageTitle">Overview</h1></div><div><span class="pill" id="adminEmail">Admin</span> <button class="btn" id="logout">Sign out</button></div></div><div id="content"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const sb=window.supabase?.createClient('https://ufhobvpuwhainuheewxb.supabase.co','sb_publishable_upE73V2Ve1wcxj8gXZ9U0A_e5EmKhNy');const $=id=>document.getElementById(id),e=(tag,txt,cls)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x},money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format((Number(n)||0)/100);const pages=['Overview','Orders','Customers','Products & Stock','Payments','Reviews','Marketing','Analytics','Settings'];let orders=[],page='Overview',user=null,loadError='';
function node(tag,cls,parent,text){const x=e(tag,text,cls);if(parent)parent.append(x);return x}function notice(parent,msg){node('div','notice',parent,msg)}function card(parent,label,value,sub){const c=node('div','card',parent);node('div','muted',c,label);node('div','metric',c,value);node('div','muted',c,sub||'');return c}function section(parent,title){const p=node('section','panel',parent);node('h2','',p,title);return p}
async function check(){if(!sb){$('loginMsg').textContent='Unable to load secure sign-in. Refresh this page.';return}const {data:{user:u}}=await sb.auth.getUser();if(!u){user=null;$('app').classList.add('hide');$('login').classList.remove('hide');return}const {data:member,error}=await sb.from('review_admins').select('user_id').eq('user_id',u.id).maybeSingle();if(error||!member){await sb.auth.signOut();$('loginMsg').textContent='This account does not have administrator access.';return}user=u;$('login').classList.add('hide');$('app').classList.remove('hide');$('adminEmail').textContent=u.email||'Admin';await reload()}
async function reload(){const {data,error}=await sb.from('customer_orders').select('id,order_number,items,total_pence,currency,payment_status,fulfillment_status,tracking_number,customer_name,customer_email,customer_phone,shipping_address,created_at,dispatched_at').order('created_at',{ascending:false}).limit(500);orders=data||[];loadError=error?.message||'';render()}
function render(){const nav=$('nav');nav.replaceChildren();pages.forEach(p=>{const b=node('button','nav'+(page===p?' active':''),nav);const icons=['◈','▤','♙','▣','£','★','✦','▥','⚙'];node('span','nav-icon',b,icons[pages.indexOf(p)]);node('span','',b,p);b.onclick=()=>{page=p;render()}});$('pageTitle').textContent=page;const root=$('content');root.replaceChildren();if(loadError)notice(root,'Order data could not be loaded: '+loadError);if(page==='Overview')overview(root);else if(page==='Orders')ordersPage(root);else if(page==='Customers')customers(root);else if(page==='Products & Stock')products(root);else if(page==='Payments')payments(root);else if(page==='Reviews')reviews(root);else if(page==='Marketing')marketing(root);else if(page==='Analytics')analytics(root);else settings(root)}
function overview(root){const welcome=node('div','welcome',root);const copy=node('div','',welcome);node('div','eyebrow',copy,'HALONAP · BUSINESS OVERVIEW');node('h2','',copy,'Welcome to your admin studio');node('p','',copy,'Your orders, customers and business insights in one place.');node('div','welcome-mark',welcome,'✦');const paid=orders.filter(o=>o.payment_status==='paid');const cards=node('div','cards',root);card(cards,'Revenue from loaded paid orders',money(paid.reduce((s,o)=>s+(Number(o.total_pence)||0),0)),'Up to 500 recent orders');card(cards,'Total orders',String(orders.length),'Loaded order records');card(cards,'Pending fulfilment',String(orders.filter(o=>(o.fulfillment_status||'pending')==='pending').length),'Action required');card(cards,'Customers',String(new Set(orders.map(o=>o.customer_email).filter(Boolean)).size),'Unique emails in orders');const p=section(root,'Recent orders');const b=node('button','btn',p,'View all orders →');b.onclick=()=>{page='Orders';render()};orderTable(p,orders.slice(0,8),false);if(!orders.length)notice(p,'No synced orders yet. Stripe checkout and webhook delivery must be tested before orders appear.')}
function orderTable(parent,rows,editable){const wrap=node('div','',parent),t=node('table','',wrap),head=node('thead','',t),tr=node('tr','',head);['Order','Customer','Products','Total','Payment','Fulfilment',...(editable?['Manage']:[])].forEach(s=>node('th','',tr,s));const body=node('tbody','',t);rows.forEach(o=>{const r=node('tr','',body),c=(value)=>node('td','',r,value||'—');const d=new Date(o.created_at);c((o.order_number||String(o.id).slice(0,8))+' · '+(isNaN(d)?'':d.toLocaleDateString('en-GB')));const cu=c(o.customer_name||'Guest');node('small','',cu,o.customer_email||'No email');const items=Array.isArray(o.items)?o.items:[];c(items.map(i=>[i.name||i.description||i.colour||i.color||'Sleep mask',i.quantity?'×'+i.quantity:''].join(' ')).join(', ')||'—');c(money(o.total_pence));c(o.payment_status||'—');c(o.fulfillment_status||'pending');if(editable){const td=c('');const btn=node('button','btn',td,'Manage');btn.onclick=()=>details(parent,o)}})}
function ordersPage(root){const p=section(root,'Order management');const bar=node('div','toolbar',p),search=node('input','',bar);search.placeholder='Search order, name, email…';search.setAttribute('aria-label','Search orders');const filter=node('select','',bar);['All','pending','processing','dispatched','delivered','cancelled'].forEach(s=>{const op=node('option','',filter,s);op.value=s});const refresh=node('button','btn',bar,'↻ Refresh');refresh.onclick=reload;const area=node('div','',p);function update(){area.replaceChildren();const q=search.value.toLowerCase(),s=filter.value;orderTable(area,orders.filter(o=>(s==='All'||(o.fulfillment_status||'pending')===s)&&[o.order_number,o.customer_name,o.customer_email,o.customer_phone].some(v=>String(v||'').toLowerCase().includes(q))),true)}search.oninput=update;filter.onchange=update;update();if(orders.length===500)notice(p,'Showing the latest 500 orders. Pagination is not yet enabled.')}
function details(parent,o){const old=$('orderDetails');if(old)old.remove();const p=section(parent,'Manage order '+(o.order_number||String(o.id).slice(0,8)));p.id='orderDetails';const a=o.shipping_address||{};node('p','',p,'Customer: '+[o.customer_name,o.customer_email,o.customer_phone].filter(Boolean).join(' · '));node('p','',p,'Delivery: '+[a.line1,a.line2,a.city,a.state,a.postal_code,a.country].filter(Boolean).join(', '));const status=node('select','',p);['pending','processing','dispatched','delivered','cancelled'].forEach(s=>{const op=node('option','',status,s);op.value=s});status.value=o.fulfillment_status||'pending';const tracking=node('input','',p);tracking.placeholder='Tracking number';tracking.value=o.tracking_number||'';tracking.setAttribute('aria-label','Tracking number');const save=node('button','btn primary',p,'Save order update'),msg=node('p','muted',p);save.onclick=async()=>{save.disabled=true;const patch={fulfillment_status:status.value,tracking_number:tracking.value.trim()||null};if(status.value==='dispatched'&&!o.dispatched_at)patch.dispatched_at=new Date().toISOString();const {error}=await sb.from('customer_orders').update(patch).eq('id',o.id);msg.textContent=error?'Save failed: '+error.message:'Order updated successfully';save.disabled=false;if(!error)await reload()};p.scrollIntoView({behavior:'smooth',block:'start'})}
function customers(root){const p=section(root,'Customers from orders');notice(p,'This list contains customers from synced orders, not every registered account.');const map=new Map();orders.forEach(o=>{if(!o.customer_email)return;const k=o.customer_email.toLowerCase(),v=map.get(k)||{name:o.customer_name||'Customer',email:o.customer_email,orders:0,spent:0};v.orders++;if(o.payment_status==='paid')v.spent+=Number(o.total_pence)||0;map.set(k,v)});const t=node('table','',p),h=node('tr','',t);['Customer','Email','Orders','Paid spend'].forEach(x=>node('th','',h,x));map.forEach(v=>{const r=node('tr','',t);[v.name,v.email,String(v.orders),money(v.spent)].forEach(x=>node('td','',r,x))})}
async function products(root){const p=section(root,'Products & stock control');notice(p,'Set real stock quantities before enabling stock limits. Blank stock means not yet configured. Stripe prices are managed in Stripe, not here.');const area=node('div','',p);const {data,error}=await sb.from('product_inventory').select('colour,stock_quantity,is_active,updated_at').order('colour');if(error){notice(area,'Could not load inventory: '+error.message);return}for(const item of data||[]){const row=node('div','panel',area);node('h2','',row,'HALONAP Sleep Eye Mask · '+item.colour);const controls=node('div','toolbar',row);const stock=node('input','',controls);stock.type='number';stock.min='0';stock.step='1';stock.placeholder='Stock not configured';stock.value=item.stock_quantity===null?'':String(item.stock_quantity);stock.setAttribute('aria-label',item.colour+' stock quantity');const status=node('select','',controls);for(const [label,value] of [['Available','true'],['Hidden / unavailable','false']]){const opt=node('option','',status,label);opt.value=value}status.value=String(item.is_active);const save=node('button','btn primary',controls,'Save changes'),msg=node('span','muted',controls);save.onclick=async()=>{const qty=stock.value.trim()===''?null:Number(stock.value);if(qty!==null&&(!Number.isSafeInteger(qty)||qty<0)){msg.textContent='Enter a valid whole number';return}save.disabled=true;const {error}=await sb.from('product_inventory').update({stock_quantity:qty,is_active:status.value==='true',updated_at:new Date().toISOString()}).eq('colour',item.colour);msg.textContent=error?'Save failed: '+error.message:'Saved successfully';save.disabled=false}}}
function payments(root){const p=section(root,'Stripe payment overview');const paid=orders.filter(o=>o.payment_status==='paid');const g=node('div','cards',p);card(g,'Paid orders',String(paid.length),'Synced records');card(g,'Recorded paid revenue',money(paid.reduce((a,o)=>a+(Number(o.total_pence)||0),0)),'Not a Stripe balance');node('p','muted',p,'Refunds, fees and payouts must be managed securely in Stripe.');const link=node('a','btn',p,'Open Stripe Dashboard ↗');link.href='https://dashboard.stripe.com/payments';link.target='_blank';link.rel='noopener noreferrer'}
async function reviews(root){const p=section(root,'Customer review approvals');const controls=node('div','toolbar',p);const filter=node('select','',controls);['All','pending','approved','rejected'].forEach(v=>{const o=node('option','',filter,v);o.value=v});const refresh=node('button','btn',controls,'↻ Refresh');const area=node('div','',p);let reviewsData=[];function show(){area.replaceChildren();const visible=reviewsData.filter(r=>filter.value==='All'||r.status===filter.value);if(!visible.length){notice(area,'No reviews in this category.');return}for(const review of visible){const box=node('article','panel',area);node('div','eyebrow',box,(review.status||'pending').toUpperCase()+' · '+new Date(review.created_at).toLocaleDateString('en-GB'));node('h2','',box,(review.name||'Customer')+' · '+'★'.repeat(Math.max(0,Math.min(5,Number(review.rating)||0))));node('p','',box,review.review||'');const gallery=node('div','toolbar',box);for(const path of review.media_paths||[]){const url=sb.storage.from('review-media').getPublicUrl(path).data.publicUrl;if(/\\.(mp4|webm|mov)$/i.test(path)){const v=node('video','',gallery);v.src=url;v.controls=true;v.preload='metadata';v.style.maxWidth='200px'}else{const a=node('a','',gallery);a.href=url;a.target='_blank';a.rel='noopener noreferrer';const img=node('img','',a);img.src=url;img.alt='Customer review photo';img.loading='lazy';img.style.cssText='width:110px;height:110px;object-fit:cover;border-radius:12px'}}const actions=node('div','toolbar',box),msg=node('span','muted',actions);for(const [label,status] of [['Approve','approved'],['Reject','rejected'],['Delete','delete']]){const b=node('button','btn'+(status==='approved'?' primary':''),actions,label);b.disabled=status===review.status;b.onclick=async()=>{if(status==='delete'&&!confirm('Permanently delete this review?'))return;b.disabled=true;msg.textContent='Saving…';const result=status==='delete'?await sb.from('product_reviews').delete().eq('id',review.id):await sb.from('product_reviews').update({status}).eq('id',review.id);if(result.error){msg.textContent='Error: '+result.error.message;b.disabled=false}else await load()}}}}async function load(){area.replaceChildren();node('p','muted',area,'Loading reviews…');const {data,error}=await sb.from('product_reviews').select('id,name,rating,review,status,media_paths,created_at').order('created_at',{ascending:false}).limit(200);if(error){area.replaceChildren();notice(area,'Could not load reviews: '+error.message);return}reviewsData=data||[];show()}filter.onchange=show;refresh.onclick=load;await load()}
function marketing(root){const p=section(root,'Marketing centre');notice(p,'Campaign tracking and discount-code management need a connected campaign backend. No active campaigns or conversion figures are assumed.');const a=node('a','btn',p,'Visit Stripe coupons ↗');a.href='https://dashboard.stripe.com/coupons';a.target='_blank';a.rel='noopener noreferrer'}
function analytics(root){const p=section(root,'Order analytics');const counts={};orders.forEach(o=>{const d=(o.created_at||'').slice(0,7)||'Unknown';counts[d]??={orders:0,revenue:0};counts[d].orders++;if(o.payment_status==='paid')counts[d].revenue+=Number(o.total_pence)||0});const t=node('table','',p),h=node('tr','',t);['Month','Orders','Paid revenue'].forEach(x=>node('th','',h,x));Object.entries(counts).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([k,v])=>{const r=node('tr','',t);[k,String(v.orders),money(v.revenue)].forEach(x=>node('td','',r,x))});if(!orders.length)notice(p,'Analytics will appear when orders are synced.')}
function settings(root){const p=section(root,'Security & settings');node('p','',p,'Signed in as: '+(user?.email||''));notice(p,'Access is restricted to members of the Supabase review_admins table, with order permissions enforced by Row Level Security.');const a=node('a','btn',p,'Visit HALONAP ↗');a.href='/'}
$('loginForm').onsubmit=async ev=>{ev.preventDefault();$('loginMsg').textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'';if(!error)await check()};$('logout').onclick=async()=>{await sb.auth.signOut();await check()};check()})();
</script></body></html>
