<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HALONAP | Admin Studio</title><style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2743;background:#f5f7fb;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dfb755;outline-offset:3px}
.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(175deg,#111b3b 0%,#0b1530 72%,#17254a 100%);border-right:1px solid #273452;padding:32px 16px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}
.brand{font-family:Georgia,serif;font-size:31px;font-weight:700;letter-spacing:2px;margin:0 14px 7px;color:#e9b947}.sub{font-size:10px;font-weight:700;letter-spacing:3.2px;color:#a7b5d0;margin:0 14px 36px}
.navwrap{display:grid;gap:4px}.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:13px 15px;border-radius:11px;color:#c5cde0;font-size:13px;font-weight:550;transition:background .16s,border-color .16s,color .16s}
.nav.active{background:#263758;border-color:#425476;color:#f4c763;font-weight:750;box-shadow:inset 3px 0 #e5b849}.nav:hover{background:#223252;color:#fff}.nav-icon{font-size:17px;width:23px;text-align:center;opacity:.95}
.sidefooter{margin-top:auto;padding:20px 14px 4px;color:#a4b3ce;font-size:12px;line-height:2}.sidefooter a{color:#f0c96b;text-decoration:none}
.main{padding:34px clamp(20px,3.5vw,56px) 64px;min-width:0;max-width:1600px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #e5e9f1;padding-bottom:19px;margin-bottom:23px}
.eyebrow{color:#99711f;font-size:10px;letter-spacing:2.1px;text-transform:uppercase;font-weight:800}
h1{font-family:Georgia,serif;font-weight:500;font-size:37px;letter-spacing:-.8px;margin:9px 0 0}h2{font-size:19px;font-weight:750;letter-spacing:-.3px;margin:0 0 16px}
.pill,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #d8deea;background:#fff;border-radius:10px;padding:10px 14px;color:#233657;font-size:12px;font-weight:700;text-decoration:none;min-height:39px}
.pill{background:#f0f3f9;color:#455473;border-radius:999px}.btn:hover{background:#f7f9fd;border-color:#adbacf}.btn.primary{background:#dba936;color:#111b34;border-color:#dba936;font-weight:800}.btn.primary:hover{background:#efc25d}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.panel{background:#fff;border:1px solid #e6eaf1;border-radius:16px;padding:23px;box-shadow:0 5px 22px rgba(21,35,64,.035)}
.card{min-height:142px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#d8a334,#f6d987)}
.metric{font-size:30px;letter-spacing:-1px;font-weight:750;margin:18px 0 5px;color:#152545;font-variant-numeric:tabular-nums}.muted{color:#738099;font-size:12px;line-height:1.55}.panel{margin-top:19px;overflow:auto}.panel .panel{box-shadow:none;background:#fcfdff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,select{border:1px solid #dce2ec;background:#fff;color:#182849;border-radius:9px;padding:11px 12px;max-width:100%;min-height:40px}input::placeholder{color:#8995a9}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:590px}td,th{padding:15px 13px;text-align:left;border-bottom:1px solid #edf0f5;vertical-align:middle}th{background:#f7f9fc;color:#667590;font-size:10px;letter-spacing:.7px;text-transform:uppercase;font-weight:800}tbody tr:hover{background:#fbfcff}td small{display:block;color:#7c899e;margin-top:5px}
.tag{border-radius:99px;background:#f4ead2;color:#82601b;padding:5px 10px;white-space:nowrap}.hide{display:none!important}.notice{padding:15px 18px;border:1px solid #f1e3b8;border-radius:11px;background:#fffbef;color:#82601d;margin-top:20px;font-size:13px;line-height:1.6}
.login{max-width:440px;margin:10vh auto;padding:38px;background:#fff!important;color:#1b2743}.login .brand{margin:0 0 16px}.login h2{font-family:Georgia,serif;font-size:27px}.login input{width:100%;margin:7px 0 15px}.login button{width:100%;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tiny{font-size:12px}a{color:#946c1b}
.welcome{background:linear-gradient(115deg,#111c3d,#20365d);border-radius:17px;color:#fff;padding:27px 31px;margin-bottom:21px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 10px 25px #16294c16}.welcome h2{font-family:Georgia,serif;font-weight:500;font-size:26px;margin:8px 0}.welcome p{margin:0;color:#cad4e8;font-size:13px}.welcome .eyebrow{color:#f3ca6d}.welcome-mark{color:#efc663;font-family:Georgia,serif;font-size:43px;opacity:.9}
@media(max-width:1080px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;min-height:0;position:relative;padding:17px 14px 12px;border-right:0;border-bottom:1px solid #26324e}.brand{font-size:24px}.sub{margin:0 14px 13px}.navwrap{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}.nav{width:auto;white-space:nowrap;padding:11px 13px;flex-shrink:0}.sidefooter{display:none}.main{padding:23px 16px 40px}.top{align-items:flex-start}h1{font-size:31px}}
@media(max-width:500px){.cards{gap:10px}.card{padding:15px;min-height:125px}.metric{font-size:25px}.top .pill{display:none}.welcome{padding:20px}.welcome h2{font-size:22px}.welcome-mark{display:none}.panel{padding:16px}}

.brand-logo{background:#fff;border-radius:12px;padding:10px 12px;margin:0 10px 12px;display:flex;align-items:center;justify-content:center;min-height:69px}.brand-logo img{display:block;width:100%;height:auto;max-height:57px;object-fit:contain}.login .brand-logo{margin:0 0 22px;max-width:250px;border:1px solid #edf0f5;background:#fff}.side .brand-logo{box-shadow:0 5px 15px #0000001a}@media(max-width:900px){.side .brand-logo{max-width:200px;min-height:55px;padding:7px 10px;margin-bottom:8px}}

.brand-wordmark{display:block;background:transparent;border:0;box-shadow:none;color:#f5f7ff;font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",Arial,sans-serif;font-size:34px;font-weight:750;letter-spacing:-1.8px;line-height:1.2;text-transform:none;padding:0;margin:0 14px 8px}.brand-wordmark .gold-o{color:#e3a72d}.login .brand-wordmark{color:#101b4b;margin:0 0 20px;font-size:42px}.side .brand-wordmark{color:#f3f5ff}@media(max-width:900px){.side .brand-wordmark{font-size:29px;margin-bottom:8px}}
</style></head><body>
<div id="login" class="panel login"><div class="brand brand-wordmark" aria-label="Halonap">Hal<span class="gold-o">o</span>nap</div><p class="eyebrow">Private Management Studio</p><h2>Admin sign in</h2><p class="muted">Only authorised HALONAP administrators can access customer orders.</p><form id="loginForm"><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required></label><button class="btn primary">Sign in securely</button></form><p id="loginMsg" class="muted" role="status"></p><a class="tiny" href="/">← Back to HALONAP</a></div>
<div id="app" class="shell hide"><aside class="side"><div class="brand brand-wordmark" aria-label="Halonap">Hal<span class="gold-o">o</span>nap</div><div class="sub">ADMIN STUDIO</div><div class="navwrap" id="nav"></div><div class="sidefooter">Private · HALONAP UK<br><a href="/">View storefront ↗</a></div></aside><main class="main"><div class="top"><div><div class="eyebrow">HALONAP · MANAGEMENT</div><h1 id="pageTitle">Overview</h1></div><div><span class="pill" id="adminEmail">Admin</span> <button class="btn" id="logout">Sign out</button></div></div><div id="content"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
