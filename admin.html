<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HALONAP | Admin Studio</title><style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172342;background:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:#f8fafc}button,input,select{font:inherit}button{cursor:pointer}
.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.side{background:#101936;border-right:1px solid #26324e;padding:30px 18px}
.brand{font-family:Georgia,serif;font-size:31px;font-weight:bold;letter-spacing:2px;margin:0 12px 8px;color:#e4ae26}.sub{font-size:10px;letter-spacing:3px;color:#c6a968;margin:0 12px 38px}
.nav{display:block;width:100%;text-align:left;background:transparent;border:0;padding:13px 16px;border-radius:13px;margin:5px 0;color:#bdc5d6}.nav.active,.nav:hover{background:#293454;color:#f2bf42;font-weight:700}
.main{padding:32px clamp(16px,4vw,55px);min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.eyebrow{color:#e4ae26;font-size:11px;letter-spacing:2px;text-transform:uppercase}
h1{font-family:Georgia,serif;font-weight:500;font-size:36px;margin:8px 0 23px}h2{font-family:Georgia,serif;font-weight:500}
.pill,.btn{border:1px solid #d4b36a;background:#ffffff;border-radius:12px;padding:10px 14px;color:#f0c25b}.btn.primary{background:#e4ae26;color:#0b1230;border-color:#e4ae26;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.panel{background:#ffffff;border:1px solid #e4e8f0;border-radius:20px;padding:22px;box-shadow:0 8px 26px #0002}
.metric{font-size:30px;font-weight:700;margin:14px 0 3px;color:#a87913}.muted{color:#63718c;font-size:13px}.panel{margin-top:20px;overflow:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}input,select{border:1px solid #cbd4e4;background:#ffffff;color:#172342;border-radius:10px;padding:10px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:13px;text-align:left;border-bottom:1px solid #e8edf5;vertical-align:top}th{color:#926c24;font-size:11px;text-transform:uppercase}td small{display:block;color:#63718c;margin-top:4px}
.tag{border-radius:99px;background:#293454;padding:5px 10px;white-space:nowrap}.hide{display:none!important}.notice{padding:15px;border-radius:12px;background:#fff8e9;color:#765718;margin-top:20px}
.login{background:#fff!important;color:#172342;max-width:410px;margin:12vh auto;padding:35px}.login input{width:100%;margin:7px 0 13px}.login button{width:100%;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tiny{font-size:12px}
.sidefooter{margin-top:55px;padding:12px;color:#9faec9;font-size:12px}a{color:#e4ae26}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:16px;border-right:0;border-bottom:1px solid #26324e}.brand{font-size:23px}.sub{margin-bottom:8px}.navwrap{display:flex;overflow:auto;gap:5px}.nav{width:auto;white-space:nowrap}.sidefooter{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.main{padding:20px 14px}h1{font-size:29px}}
@media(max-width:430px){.cards{gap:8px}.card{padding:14px}.metric{font-size:23px}}
</style></head><body>
<div id="login" class="panel login"><div class="brand">HALONAP</div><p class="eyebrow">Private Management Studio</p><h2>Admin sign in</h2><p class="muted">Only authorised HALONAP administrators can access customer orders.</p><form id="loginForm"><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required></label><button class="btn primary">Sign in securely</button></form><p id="loginMsg" class="muted" role="status"></p><a class="tiny" href="/">← Back to HALONAP</a></div>
<div id="app" class="shell hide"><aside class="side"><div class="brand">HALONAP</div><div class="sub">ADMIN STUDIO</div><div class="navwrap" id="nav"></div><div class="sidefooter">Private · HALONAP UK<br><a href="/">View storefront ↗</a></div></aside><main class="main"><div class="top"><div><div class="eyebrow">HALONAP · MANAGEMENT</div><h1 id="pageTitle">Overview</h1></div><div><span class="pill" id="adminEmail">Admin</span> <button class="btn" id="logout">Sign out</button></div></div><div id="content"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const sb=window.supabase?.createClient('https://ufhobvpuwhainuheewxb.supabase.co','sb_publishable_upE73V2Ve1wcxj8gXZ9U0A_e5EmKhNy');const $=id=>document.getElementById(id),e=(tag,txt,cls)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x},money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format((Number(n)||0)/100);const pages=['Overview','Orders','Customers','Products & Stock','Payments','Reviews','Marketing','Analytics','Settings'];let orders=[],page='Overview',user=null,loadError='';
function node(tag,cls,parent,text){const x=e(tag,text,cls);if(parent)parent.append(x);return x}function notice(parent,msg){node('div','notice',parent,msg)}function card(parent,label,value,sub){const c=node('div','card',parent);node('div','muted',c,label);node('div','metric',c,value);node('div','muted',c,sub||'');return c}function section(parent,title){const p=node('section','panel',parent);node('h2','',p,title);return p}
async function check(){if(!sb){$('loginMsg').textContent='Unable to load secure sign-in. Refresh this page.';return}const {data:{user:u}}=await sb.auth.getUser();if(!u){user=null;$('app').classList.add('hide');$('login').classList.remove('hide');return}const {data:member,error}=await sb.from('review_admins').select('user_id').eq('user_id',u.id).maybeSingle();if(error||!member){await sb.auth.signOut();$('loginMsg').textContent='This account does not have administrator access.';return}user=u;$('login').classList.add('hide');$('app').classList.remove('hide');$('adminEmail').textContent=u.email||'Admin';await reload()}
async function reload(){const {data,error}=await sb.from('customer_orders').select('id,order_number,items,total_pence,currency,payment_status,fulfillment_status,tracking_number,customer_name,customer_email,customer_phone,shipping_address,created_at,dispatched_at').order('created_at',{ascending:false}).limit(500);orders=data||[];loadError=error?.message||'';render()}
function render(){const nav=$('nav');nav.replaceChildren();pages.forEach(p=>{const b=node('button','nav'+(page===p?' active':''),nav,p);b.onclick=()=>{page=p;render()}});$('pageTitle').textContent=page;const root=$('content');root.replaceChildren();if(loadError)notice(root,'Order data could not be loaded: '+loadError);if(page==='Overview')overview(root);else if(page==='Orders')ordersPage(root);else if(page==='Customers')customers(root);else if(page==='Products & Stock')products(root);else if(page==='Payments')payments(root);else if(page==='Reviews')reviews(root);else if(page==='Marketing')marketing(root);else if(page==='Analytics')analytics(root);else settings(root)}
function overview(root){const paid=orders.filter(o=>o.payment_status==='paid');const cards=node('div','cards',root);card(cards,'Revenue from loaded paid orders',money(paid.reduce((s,o)=>s+(Number(o.total_pence)||0),0)),'Up to 500 recent orders');card(cards,'Total orders',String(orders.length),'Loaded order records');card(cards,'Pending fulfilment',String(orders.filter(o=>(o.fulfillment_status||'pending')==='pending').length),'Action required');card(cards,'Customers',String(new Set(orders.map(o=>o.customer_email).filter(Boolean)).size),'Unique emails in orders');const p=section(root,'Recent orders');const b=node('button','btn',p,'View all orders →');b.onclick=()=>{page='Orders';render()};orderTable(p,orders.slice(0,8),false);if(!orders.length)notice(p,'No synced orders yet. Stripe checkout and webhook delivery must be tested before orders appear.')}
function orderTable(parent,rows,editable){const wrap=node('div','',parent),t=node('table','',wrap),head=node('thead','',t),tr=node('tr','',head);['Order','Customer','Products','Total','Payment','Fulfilment',...(editable?['Manage']:[])].forEach(s=>node('th','',tr,s));const body=node('tbody','',t);rows.forEach(o=>{const r=node('tr','',body),c=(value)=>node('td','',r,value||'—');const d=new Date(o.created_at);c((o.order_number||String(o.id).slice(0,8))+' · '+(isNaN(d)?'':d.toLocaleDateString('en-GB')));const cu=c(o.customer_name||'Guest');node('small','',cu,o.customer_email||'No email');const items=Array.isArray(o.items)?o.items:[];c(items.map(i=>[i.name||i.description||i.colour||i.color||'Sleep mask',i.quantity?'×'+i.quantity:''].join(' ')).join(', ')||'—');c(money(o.total_pence));c(o.payment_status||'—');c(o.fulfillment_status||'pending');if(editable){const td=c('');const btn=node('button','btn',td,'Manage');btn.onclick=()=>details(parent,o)}})}
function ordersPage(root){const p=section(root,'Order management');const bar=node('div','toolbar',p),search=node('input','',bar);search.placeholder='Search order, name, email…';search.setAttribute('aria-label','Search orders');const filter=node('select','',bar);['All','pending','processing','dispatched','delivered','cancelled'].forEach(s=>{const op=node('option','',filter,s);op.value=s});const refresh=node('button','btn',bar,'↻ Refresh');refresh.onclick=reload;const area=node('div','',p);function update(){area.replaceChildren();const q=search.value.toLowerCase(),s=filter.value;orderTable(area,orders.filter(o=>(s==='All'||(o.fulfillment_status||'pending')===s)&&[o.order_number,o.customer_name,o.customer_email,o.customer_phone].some(v=>String(v||'').toLowerCase().includes(q))),true)}search.oninput=update;filter.onchange=update;update();if(orders.length===500)notice(p,'Showing the latest 500 orders. Pagination is not yet enabled.')}
function details(parent,o){const old=$('orderDetails');if(old)old.remove();const p=section(parent,'Manage order '+(o.order_number||String(o.id).slice(0,8)));p.id='orderDetails';const a=o.shipping_address||{};node('p','',p,'Customer: '+[o.customer_name,o.customer_email,o.customer_phone].filter(Boolean).join(' · '));node('p','',p,'Delivery: '+[a.line1,a.line2,a.city,a.state,a.postal_code,a.country].filter(Boolean).join(', '));const status=node('select','',p);['pending','processing','dispatched','delivered','cancelled'].forEach(s=>{const op=node('option','',status,s);op.value=s});status.value=o.fulfillment_status||'pending';const tracking=node('input','',p);tracking.placeholder='Tracking number';tracking.value=o.tracking_number||'';tracking.setAttribute('aria-label','Tracking number');const save=node('button','btn primary',p,'Save order update'),msg=node('p','muted',p);save.onclick=async()=>{save.disabled=true;const patch={fulfillment_status:status.value,tracking_number:tracking.value.trim()||null};if(status.value==='dispatched'&&!o.dispatched_at)patch.dispatched_at=new Date().toISOString();const {error}=await sb.from('customer_orders').update(patch).eq('id',o.id);msg.textContent=error?'Save failed: '+error.message:'Order updated successfully';save.disabled=false;if(!error)await reload()};p.scrollIntoView({behavior:'smooth',block:'start'})}
function customers(root){const p=section(root,'Customers from orders');notice(p,'This list contains customers from synced orders, not every registered account.');const map=new Map();orders.forEach(o=>{if(!o.customer_email)return;const k=o.customer_email.toLowerCase(),v=map.get(k)||{name:o.customer_name||'Customer',email:o.customer_email,orders:0,spent:0};v.orders++;if(o.payment_status==='paid')v.spent+=Number(o.total_pence)||0;map.set(k,v)});const t=node('table','',p),h=node('tr','',t);['Customer','Email','Orders','Paid spend'].forEach(x=>node('th','',h,x));map.forEach(v=>{const r=node('tr','',t);[v.name,v.email,String(v.orders),money(v.spent)].forEach(x=>node('td','',r,x))})}
function products(root){const p=section(root,'HALONAP Sleep Eye Mask');notice(p,'Product variants are shown for reference. Live stock counts and price editing require an inventory database and storefront integration; no stock figures are invented.');const g=node('div','cards',p);['Black','Pink','Grey'].forEach(c=>card(g,c+' mask','£12.99','Inventory not connected'))}
function payments(root){const p=section(root,'Stripe payment overview');const paid=orders.filter(o=>o.payment_status==='paid');const g=node('div','cards',p);card(g,'Paid orders',String(paid.length),'Synced records');card(g,'Recorded paid revenue',money(paid.reduce((a,o)=>a+(Number(o.total_pence)||0),0)),'Not a Stripe balance');node('p','muted',p,'Refunds, fees and payouts must be managed securely in Stripe.');const link=node('a','btn',p,'Open Stripe Dashboard ↗');link.href='https://dashboard.stripe.com/payments';link.target='_blank';link.rel='noopener noreferrer'}
function reviews(root){const p=section(root,'Customer reviews');notice(p,'Existing website review tools are preserved. Use the Reviews section on the storefront for current review moderation.');const a=node('a','btn',p,'Open website reviews ↗');a.href='/#reviews'}
function marketing(root){const p=section(root,'Marketing centre');notice(p,'Campaign tracking and discount-code management need a connected campaign backend. No active campaigns or conversion figures are assumed.');const a=node('a','btn',p,'Visit Stripe coupons ↗');a.href='https://dashboard.stripe.com/coupons';a.target='_blank';a.rel='noopener noreferrer'}
function analytics(root){const p=section(root,'Order analytics');const counts={};orders.forEach(o=>{const d=(o.created_at||'').slice(0,7)||'Unknown';counts[d]??={orders:0,revenue:0};counts[d].orders++;if(o.payment_status==='paid')counts[d].revenue+=Number(o.total_pence)||0});const t=node('table','',p),h=node('tr','',t);['Month','Orders','Paid revenue'].forEach(x=>node('th','',h,x));Object.entries(counts).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([k,v])=>{const r=node('tr','',t);[k,String(v.orders),money(v.revenue)].forEach(x=>node('td','',r,x))});if(!orders.length)notice(p,'Analytics will appear when orders are synced.')}
function settings(root){const p=section(root,'Security & settings');node('p','',p,'Signed in as: '+(user?.email||''));notice(p,'Access is restricted to members of the Supabase review_admins table, with order permissions enforced by Row Level Security.');const a=node('a','btn',p,'Visit HALONAP ↗');a.href='/'}
$('loginForm').onsubmit=async ev=>{ev.preventDefault();$('loginMsg').textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'';if(!error)await check()};$('logout').onclick=async()=>{await sb.auth.signOut();await check()};check()})();
</script></body></html>
