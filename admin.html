<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HALONAP | Admin Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=20261124c">
<link rel="manifest" href="/admin.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<!-- Sign in -->
<main id="login" class="login-screen">
  <div class="login-card">
    <div class="wordmark wordmark-dark" aria-label="Halonap">Hal<span>o</span>nap</div>
    <p class="eyebrow">Private Management Studio</p>
    <h1>Admin sign in</h1>
    <p class="muted">Only authorised HALONAP administrators can access customer orders.</p>
    <form id="loginForm" class="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-block">Sign in securely</button>
    </form>
    <p id="loginMsg" class="login-msg" role="status"></p>
    <a class="back-link" href="/">← Back to HALONAP</a>
  </div>
</main>

<!-- Studio -->
<div id="app" class="shell hide">
  <aside class="side" id="side">
    <div class="side-brand">
      <div class="wordmark" aria-label="Halonap">Hal<span>o</span>nap</div>
      <div class="side-tag">Admin Studio</div>
    </div>
    <nav class="side-nav" id="nav" aria-label="Admin sections"></nav>
    <div class="side-foot">
      <div class="side-user">
        <span class="avatar" id="adminAvatar">A</span>
        <span class="side-user-text"><strong>Signed in</strong><span id="adminEmail">Admin</span></span>
      </div>
      <a class="side-link" href="/" target="_blank" rel="noopener">View storefront ↗</a>
      <button class="side-link" id="logout" type="button">Sign out</button>
    </div>
  </aside>
  <div class="scrim nav-scrim" id="navScrim"></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false"></button>
      <div class="topbar-title">
        <div class="eyebrow">HALONAP · Management</div>
        <h1 id="pageTitle">Overview</h1>
        <p class="page-sub" id="pageSub"></p>
      </div>
      <div class="topbar-actions">
        <span class="sync" id="syncInfo"></span>
        <button class="btn" id="refreshAll" type="button"></button>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<!-- Order drawer -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" inert>
  <div class="drawer-head">
    <div><div class="eyebrow">Manage order</div><h2 id="drawerTitle"></h2></div>
    <button class="icon-btn" id="drawerClose" type="button" aria-label="Close order details">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-workflows.js?v=1"></script>
<script src="admin.js?v=20261124c"></script>
</body>
</html>
